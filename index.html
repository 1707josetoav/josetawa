<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voice Falling Letters</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030303;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================================================
   ESCENA
   ========================================================= */

#scene{
    position:fixed;
    inset:0;
    overflow:hidden;
}

/* =========================================================
   INTERFAZ
   ========================================================= */

#interface{
    position:fixed;
    z-index:1000;
    top:25px;
    left:50%;
    transform:translateX(-50%);

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:12px;
}

.buttons{
    display:flex;
    gap:10px;
}

button{
    border:1px solid rgba(255,255,255,.35);
    border-radius:30px;

    padding:12px 24px;

    background:rgba(255,255,255,.05);
    color:white;

    font-size:12px;
    letter-spacing:2px;

    cursor:pointer;

    transition:
        background .2s,
        color .2s,
        transform .2s;
}

button:hover{
    background:white;
    color:black;
    transform:scale(1.05);
}

#stop{
    border-color:#ff3333;
    color:#ff3333;
}

#stop:hover{
    background:#ff3333;
    color:white;
}

#status{
    color:#666;
    font-size:10px;
    letter-spacing:3px;
    text-transform:uppercase;
}

/* =========================================================
   LETRAS
   ========================================================= */

.letter{
    position:absolute;

    left:0;
    top:0;

    color:#ff1616;

    font-size:clamp(
        40px,
        7vw,
        100px
    );

    font-weight:800;

    pointer-events:none;
    user-select:none;

    will-change:
        transform,
        opacity;

    text-shadow:
        0 0 8px rgba(255,0,0,.8),
        0 0 25px rgba(255,0,0,.45),
        0 0 50px rgba(255,0,0,.15);
}

/* =========================================================
   PARTÍCULAS
   ========================================================= */

.particle{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#ff2020;

    box-shadow:
        0 0 5px #ff0000,
        0 0 12px rgba(255,0,0,.8);

    pointer-events:none;

    will-change:
        transform,
        opacity;
}

</style>
</head>

<body>

<div id="scene"></div>

<div id="interface">

    <div class="buttons">

        <button id="start">
            START
        </button>

        <button id="stop">
            STOP
        </button>

    </div>

    <div id="status">
        detenido
    </div>

</div>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const scene =
    document.getElementById("scene");

const startButton =
    document.getElementById("start");

const stopButton =
    document.getElementById("stop");

const status =
    document.getElementById("status");


/* =========================================================
   RECONOCIMIENTO DE VOZ
   ========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

let listening = false;

let lastTranscript = "";


/* =========================================================
   COMPROBAR COMPATIBILIDAD
   ========================================================= */

if(!SpeechRecognition){

    status.textContent =
        "reconocimiento de voz no compatible";

    startButton.disabled = true;

}else{

    recognition =
        new SpeechRecognition();

    recognition.lang = "es-ES";

    recognition.continuous = true;

    recognition.interimResults = true;

    recognition.maxAlternatives = 1;


    /* =====================================================
       RESULTADOS DE VOZ
       ===================================================== */

    recognition.onresult = function(event){

        if(!listening)return;

        let transcript = "";

        for(
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ){

            transcript +=
                event.results[i][0].transcript;
        }

        transcript =
            transcript.trim();

        if(!transcript)return;


        /*
         * Intentamos detectar solamente
         * las palabras nuevas.
         */

        let newText = transcript;

        if(
            lastTranscript &&
            transcript.startsWith(lastTranscript)
        ){

            newText =
                transcript.substring(
                    lastTranscript.length
                );
        }

        lastTranscript =
            transcript;


        newText =
            newText.trim();


        if(newText){

            createText(newText);
        }
    };


    /* =====================================================
       REINICIAR AUTOMÁTICAMENTE
       ===================================================== */

    recognition.onend = function(){

        if(listening){

            try{

                recognition.start();

            }catch(error){

                /*
                 * Puede ocurrir si Chrome
                 * todavía está cerrando
                 * la sesión anterior.
                 */

            }
        }
    };


    /* =====================================================
       ERRORES
       ===================================================== */

    recognition.onerror = function(event){

        if(event.error === "aborted"){
            return;
        }

        status.textContent =
            "error: " + event.error;
    };
}


/* =========================================================
   START
   ========================================================= */

startButton.addEventListener(
    "click",
    function(){

        if(!recognition)return;

        listening = true;

        lastTranscript = "";

        status.textContent =
            "escuchando...";

        try{

            recognition.start();

        }catch(error){

            console.log(error);
        }
    }
);


/* =========================================================
   STOP
   ========================================================= */

stopButton.addEventListener(
    "click",
    function(){

        listening = false;

        lastTranscript = "";

        status.textContent =
            "detenido";

        if(recognition){

            try{

                recognition.stop();

            }catch(error){

                console.log(error);
            }
        }
    }
);


/* =========================================================
   CREAR TEXTO
   ========================================================= */

function createText(text){

    if(!listening)return;


    const characters =
        [...text];


    /*
     * Calculamos el espacio
     * entre letras.
     */

    const spacing =
        Math.min(
            75,
            Math.max(
                32,
                window.innerWidth /
                (characters.length + 2)
            )
        );


    const totalWidth =
        characters.length *
        spacing;


    const startX =
        window.innerWidth / 2 -
        totalWidth / 2;


    /*
     * Cada nueva frase aparece
     * ligeramente desplazada.
     */

    const startY =
        window.innerHeight * .18 +
        Math.random() * 80;


    characters.forEach(
        function(character,index){

            /*
             * Los espacios no crean letras.
             */

            if(character === " "){
                return;
            }


            const letter =
                document.createElement("div");


            letter.className =
                "letter";


            letter.textContent =
                character;


            scene.appendChild(
                letter
            );


            const x =
                startX +
                index * spacing;


            const y =
                startY +
                Math.random() * 25;


            /*
             * Velocidad horizontal
             * aleatoria.
             */

            const velocityX =
                (Math.random() - .5) * 1.8;


            /*
             * Algunas letras comienzan
             * ligeramente hacia arriba.
             */

            const velocityY =
                -Math.random() * 2;


            animateLetter(
                letter,
                x,
                y,
                velocityX,
                velocityY
            );

        }
    );
}


/* =========================================================
   ANIMAR LETRA
   ========================================================= */

function animateLetter(
    element,
    x,
    y,
    velocityX,
    velocityY
){

    let vx =
        velocityX;

    let vy =
        velocityY;


    let rotation =
        Math.random() * 30 - 15;


    let rotationSpeed =
        Math.random() * 3 - 1.5;


    let opacity = 1;


    let age = 0;


    /*
     * Gravedad.
     */

    const gravity =
        0.14;


    function frame(){

        age++;


        /*
         * Física de caída.
         */

        vy += gravity;

        x += vx;

        y += vy;


        rotation +=
            rotationSpeed;


        /*
         * Después de aproximadamente
         * 1 segundo empieza a romperse.
         */

        if(age > 65){

            opacity -= .018;


            /*
             * Movimiento aleatorio
             * para simular desintegración.
             */

            vx +=
                (Math.random() - .5) * .08;


            vy +=
                (Math.random() - .5) * .08;


            rotationSpeed *= 1.01;
        }


        element.style.transform =
            "translate3d(" +
            x + "px," +
            y + "px,0) " +
            "rotate(" +
            rotation +
            "deg)";


        element.style.opacity =
            opacity;


        /*
         * Cuando desaparece,
         * generamos partículas.
         */

        if(opacity <= 0){

            explode(
                x,
                y
            );

            element.remove();

            return;
        }


        /*
         * Si sale de la pantalla.
         */

        if(
            y >
            window.innerHeight + 150
        ){

            explode(
                x,
                y
            );

            element.remove();

            return;
        }


        requestAnimationFrame(
            frame
        );
    }


    requestAnimationFrame(
        frame
    );
}


/* =========================================================
   DESINTEGRACIÓN
   ========================================================= */

function explode(x,y){

    /*
     * Número de partículas.
     */

    const particleCount =
        24;


    for(
        let i = 0;
        i < particleCount;
        i++
    ){

        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "particle";


        scene.appendChild(
            particle
        );


        let px =
            x + 25;


        let py =
            y + 45;


        /*
         * Explosión radial.
         */

        const angle =
            Math.random() *
            Math.PI *
            2;


        const speed =
            Math.random() * 6 + 1;


        let vx =
            Math.cos(angle) *
            speed;


        let vy =
            Math.sin(angle) *
            speed;


        let opacity = 1;


        /*
         * Tamaño aleatorio.
         */

        const size =
            Math.random() * 4 + 2;


        particle.style.width =
            size + "px";


        particle.style.height =
            size + "px";


        function particleFrame(){

            /*
             * Fricción.
             */

            vx *= .985;

            vy *= .985;


            /*
             * Gravedad pequeña.
             */

            vy += .04;


            px += vx;

            py += vy;


            opacity -= .025;


            particle.style.transform =
                "translate3d(" +
                px + "px," +
                py + "px,0)";


            particle.style.opacity =
                opacity;


            if(opacity <= 0){

                particle.remove();

                return;
            }


            requestAnimationFrame(
                particleFrame
            );
        }


        requestAnimationFrame(
            particleFrame
        );
    }
}


/* =========================================================
   LIMPIAR PANTALLA CON DOBLE CLICK EN STOP
   ========================================================= */

stopButton.addEventListener(
    "dblclick",
    function(){

        scene.innerHTML = "";

    }
);

</script>

</body>
</html>
